{% set name = "spotipy" %}
{% set version = "2.25.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c72720ef85355aff959f7fe8d89ded48504d8c33b92583db90ec16daac0da54f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - redis-py >=3.5.3
    - requests >=2.25.0
    - six >=1.15.0
    - urllib3 >=1.26.0

test:
  imports:
    - spotipy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://spotipy.readthedocs.org/
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: A light weight Python library for the Spotify Web API
  doc_url: http://spotipy.readthedocs.org/
  dev_url: https://github.com/plamere/spotipy/

extra:
  recipe-maintainers:
    - captivus
